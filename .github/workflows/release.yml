name: Release

# Publish on a version tag. Requires repo secrets:
#   NPM_TOKEN          — npm automation token for the @neptune.fintech scope
#   PUB_CREDENTIALS    — contents of ~/.config/dart/pub-credentials.json (pub.dev)
# No secrets touch any developer machine; publishing only happens from CI on a tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  credentials:
    name: Identify configured registry channels
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.channels.outputs.npm }}
      pub: ${{ steps.channels.outputs.pub }}
    steps:
      - id: channels
        name: Report registry availability
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
            echo "npm publication skipped: NPM_TOKEN is not configured. The GitHub source release does not imply npm availability." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$PUB_CREDENTIALS" ]; then
            echo "pub=true" >> "$GITHUB_OUTPUT"
          else
            echo "pub=false" >> "$GITHUB_OUTPUT"
            echo "pub.dev publication skipped: PUB_CREDENTIALS is not configured. The GitHub source release does not imply pub.dev availability." >> "$GITHUB_STEP_SUMMARY"
          fi
  npm:
    name: Publish JS packages to npm
    needs: credentials
    if: needs.credentials.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" run build
      - name: Guard — NPM_TOKEN present
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set — add it in repo settings to publish."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish (public, non-private packages only, with provenance)
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  pub_dev:
    name: Publish Flutter package to pub.dev
    needs: credentials
    if: needs.credentials.outputs.pub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
      - name: Restore pub credentials
        run: |
          if [ -z "${PUB_CREDENTIALS}" ]; then
            echo "::error::PUB_CREDENTIALS secret is not set — add it to publish to pub.dev."
            exit 1
          fi
          mkdir -p "$HOME/.config/dart"
          printf '%s' "${PUB_CREDENTIALS}" > "$HOME/.config/dart/pub-credentials.json"
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
      - working-directory: packages/neptune_flutter_ui
        run: flutter pub get
      - name: Publish
        working-directory: packages/neptune_flutter_ui
        run: flutter pub publish --force
