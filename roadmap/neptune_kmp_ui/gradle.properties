org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true

kotlin.daemon.jvmargs=-Xmx3g

# Use npm, not yarn, for Kotlin/JS+Wasm test dependencies: yarn 1.x walks up
# to the monorepo root package.json and trips over its pnpm packageManager
# field (corepack error).
kotlin.js.yarn=false
