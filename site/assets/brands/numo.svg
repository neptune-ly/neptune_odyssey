<?xml version="1.0" encoding="UTF-8"?>
<!-- NUMO — the Libyan national card scheme run by Moamalat Financial Services
     (the mark on NCB/Jumhouria/etc. Libyan bank cards: three overlapping ring
     outlines, no wordmark). Geometry matches the mark as used in production
     (ethaq/andalus/public/assets/card-networks/numo.svg), recoloured from
     white-on-transparent (meant for a dark card face) to Moamalat's own navy +
     gold pair so it reads on a light background too. -->
<svg width="60" height="24" viewBox="0 0 60 24" xmlns="http://www.w3.org/2000/svg">
  <circle cx="14" cy="12" r="10.4" fill="none" stroke="#0C2A4A" stroke-width="2.2"/>
  <circle cx="30" cy="12" r="10.4" fill="none" stroke="#0C2A4A" stroke-width="2.2"/>
  <circle cx="46" cy="12" r="10.4" fill="none" stroke="#D7A52B" stroke-width="2.2"/>
</svg>
